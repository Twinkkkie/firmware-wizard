[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firmware-wizard-portfolio-demo"
version = "0.1.0"
description = "Safe dry-run demo of a firmware deployment workflow"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
firmware-demo = "firmware_wizard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
